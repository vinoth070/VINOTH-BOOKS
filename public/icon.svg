<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14"/>
      <stop offset="50%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D07C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997819"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.35"/>

  <!-- Geometric Book Emblem -->
  <g transform="translate(106, 126)">
    <!-- Left Open Leaf -->
    <path d="M 150 200 C 100 170 30 175 0 200 L 0 50 C 30 25 100 20 150 50 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Open Leaf -->
    <path d="M 150 200 C 200 170 270 175 300 200 L 300 50 C 270 25 200 20 150 50 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Spine Spine -->
    <line x1="150" y1="50" x2="150" y2="210" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Subtle Page Lines -->
    <path d="M 25 90 C 60 72 105 70 135 85" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45"/>
    <path d="M 25 125 C 60 107 105 105 135 120" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45"/>
    <path d="M 25 160 C 60 142 105 140 135 155" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45"/>

    <path d="M 275 90 C 240 72 195 70 165 85" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45"/>
    <path d="M 275 125 C 240 107 195 105 165 120" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45"/>
    <path d="M 275 160 C 240 142 195 140 165 155" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45"/>

    <!-- Top Star Ornament -->
    <polygon points="150,15 154,27 167,27 156,35 160,47 150,39 140,47 144,35 133,27 146,27" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: VB Monogram -->
  <text x="256" y="420" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="9" 
        fill="url(#goldGrad)" 
        text-anchor="middle">
    VINOTH BOOKS
  </text>
</svg>
